name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The site is published from this workflow's artifact. If the Pages
      # source falls back to the branch build, Jekyll publishes the README
      # instead of the site (ticket 18); the script restores the source.
      - name: Keep the Pages source on GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-pages-source.js --fix ${{ github.repository }}

      - name: Build and upload Astro site
        uses: withastro/action@v6
        with:
          package-manager: pnpm@latest

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
